<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Meshy Saber Bench</title>
  <link rel="stylesheet" href="./saber-bench.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="app">
    <canvas id="benchCanvas"></canvas>
    <aside id="panel" aria-label="Saber bench controls">
      <header>
        <h1>Meshy Saber Bench</h1>
        <p id="status">booting</p>
      </header>

      <section>
        <h2>View</h2>
        <div class="row">
          <button id="viewFull" type="button">Full</button>
          <button id="viewHand" type="button">Hand</button>
          <button id="viewBlade" type="button">Blade</button>
        </div>
      </section>

      <section>
        <h2>Layer</h2>
        <div class="row">
          <button id="selectGrip" type="button">WeaponGrip</button>
          <button id="selectSabre" type="button">SabreRoot</button>
        </div>
        <p id="selectionReadout">selected: WeaponGrip</p>
        <label class="check"><input id="showRealMesh" type="checkbox" checked> real sabre mesh</label>
        <label class="check"><input id="showProxySaber" type="checkbox"> bright diagnostic proxy</label>
        <pre id="truthReadout" aria-label="Active saber truth readout">real mesh loaded: no</pre>
      </section>

      <section>
        <h2>WeaponGrip local to RightHand</h2>
        <div class="grid">
          <label>X <input id="gripPx" data-field="grip.position.0" type="number" step="0.005"></label>
          <label>Y <input id="gripPy" data-field="grip.position.1" type="number" step="0.005"></label>
          <label>Z <input id="gripPz" data-field="grip.position.2" type="number" step="0.005"></label>
          <label>RX <input id="gripRx" data-field="grip.rotationDeg.0" type="number" step="1"></label>
          <label>RY <input id="gripRy" data-field="grip.rotationDeg.1" type="number" step="1"></label>
          <label>RZ <input id="gripRz" data-field="grip.rotationDeg.2" type="number" step="1"></label>
        </div>
      </section>

      <section>
        <h2>SabreRoot local to WeaponGrip</h2>
        <div class="grid">
          <label>X <input id="sabrePx" data-field="sabre.position.0" type="number" step="0.005"></label>
          <label>Y <input id="sabrePy" data-field="sabre.position.1" type="number" step="0.005"></label>
          <label>Z <input id="sabrePz" data-field="sabre.position.2" type="number" step="0.005"></label>
          <label>RX <input id="sabreRx" data-field="sabre.rotationDeg.0" type="number" step="1"></label>
          <label>RY <input id="sabreRy" data-field="sabre.rotationDeg.1" type="number" step="1"></label>
          <label>RZ <input id="sabreRz" data-field="sabre.rotationDeg.2" type="number" step="1"></label>
          <label>Scale <input id="sabreScale" data-field="sabre.scale" type="number" min="0.02" max="4" step="0.01"></label>
        </div>
      </section>

      <section>
        <h2>Semantic hilt point in sabre mesh</h2>
        <div class="grid">
          <label>X <input id="hiltX" data-field="sabre.gripLocalPosition.0" type="number" step="0.005"></label>
          <label>Y <input id="hiltY" data-field="sabre.gripLocalPosition.1" type="number" step="0.005"></label>
          <label>Z <input id="hiltZ" data-field="sabre.gripLocalPosition.2" type="number" step="0.005"></label>
        </div>
        <label class="check"><input id="pinHilt" type="checkbox" checked> keep hilt landmark on WeaponGrip</label>
      </section>

      <section>
        <h2>Nudge selected</h2>
        <div class="row three">
          <button data-nudge="x,-1" type="button">X-</button>
          <button data-nudge="x,1" type="button">X+</button>
          <button data-nudge="y,-1" type="button">Y-</button>
          <button data-nudge="y,1" type="button">Y+</button>
          <button data-nudge="z,-1" type="button">Z-</button>
          <button data-nudge="z,1" type="button">Z+</button>
        </div>
      </section>

      <section>
        <h2>Contract</h2>
        <div class="row">
          <button id="resetBaseline" type="button">Reset</button>
          <button id="copyJson" type="button">Copy JSON</button>
          <button id="downloadJson" type="button">Download</button>
        </div>
        <textarea id="jsonBox" spellcheck="false" aria-label="Saber placement JSON"></textarea>
        <div class="row">
          <button id="applyJson" type="button">Apply JSON</button>
        </div>
      </section>
    </aside>
  </main>
  <script type="module" src="./saber-bench.js"></script>
</body>
</html>
